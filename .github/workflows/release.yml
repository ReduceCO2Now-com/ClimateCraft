name: ClimateCraft Release

on:
  push:
    tags:
      - "v*"

# Cancel duplicate executions for the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Verify release commit belongs to main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test -- --run

      - name: Build behavior pack
        run: npm run build

      - name: Package Minecraft add-on
        run: node scripts/release/package-release.mjs "$GITHUB_REF_NAME"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" == *-* ]]; then
            gh release create "$TAG" \
              "dist/ClimateCraft-$TAG.mcpack" \
              --title "ClimateCraft $TAG" \
              --generate-notes \
              --verify-tag \
              --prerelease
          else
            gh release create "$TAG" \
              "dist/ClimateCraft-$TAG.mcpack" \
              --title "ClimateCraft $TAG" \
              --generate-notes \
              --verify-tag
          fi
